# 项目级 Reasonix 配置模板。复制到项目根，按这个项目的实际门禁改 allow 列表。
#
# 解析顺序：flag > ./reasonix.toml > <Reasonix home>/config.toml > 内置默认。
# 这里只放项目边界，**不放任何密钥**——密钥走 api_key_env，存在 Reasonix 的全局 .env。
#
# 为什么每个项目都要有这个文件：Claude 会用 `reasonix subagent run` 无头驱动 Reasonix。
# 无头进程弹不出审批框，而默认 mode = "ask" 加零条规则会让它一路卡到超时。

[permissions]
# 兜底：没命中任何规则的写操作仍然要问。放行的只有下面列出的。
mode = "ask"

allow = [
    # ── 这个项目的门禁命令，按实际情况替换 ────────────────────────────
    #
    # Windows 上两种斜杠都要列：Reasonix 的 bash 工具走 Git Bash，
    # 反斜杠路径会被 shell 吞掉，实际执行的是正斜杠形式。
    #
    # Python 项目示例：
    # 'Bash(.venv\Scripts\python.exe -m pytest:*)',
    # 'Bash(.venv/Scripts/python.exe -m pytest:*)',
    # 'Bash(.venv\Scripts\python.exe -m ruff:*)',
    # 'Bash(.venv/Scripts/python.exe -m ruff:*)',
    #
    # Node 项目示例：
    # 'Bash(npm run lint:*)',
    # 'Bash(npm run build:*)',
    # 'Bash(npm test:*)',
    #
    # Go 项目示例：
    # 'Bash(go test:*)',
    # 'Bash(go vet:*)',

    # ── 装依赖：要派 operator 才需要，按实际包管理器留一两条 ───────────
    #
    # 不放行的症状和写入被拦一样：跑很久、chars=0——它卡在等审批直到超时。
    # **别图省事写 `Bash(*)`**，那等于把 deny 之外的一切都开了。
    #
    # 'Bash(npm install:*)',
    # 'Bash(npm ci:*)',
    # 'Bash(uv:*)',
    # 'Bash(pip install:*)',

    # ── 只读 git，基本每个项目都要 ──────────────────────────────────
    'Bash(git status:*)',
    'Bash(git diff:*)',
    'Bash(git log:*)',
    'Bash(git show:*)',
    'Bash(git branch:*)',
    'Bash(git rev-parse:*)',
    'Bash(git ls-files:*)',

    # ── 提交，到此为止 ─────────────────────────────────────────────
    'Bash(git add:*)',
    'Bash(git commit:*)',

    # ── 文件写入：这一条**不许删**，删了 implementer 一个字也写不出来 ──
    #
    # 症状长这样：`chars=0`、`exit=1`，回流里写着 write_file / bash 全被 declined。
    # 原因是 `subagent run` 不吃 `--permission-mode`（子代理档案自带权限），
    # 所以 rx.py 的 `--permission-mode auto` 救不了它，兜底直接落到上面的
    # mode = "ask"，无头进程没人可问 → blocked。
    #
    # 族名是 `Edit(<路径 glob>)`，**不是** `write_file(...)`。Reasonix 把七个写工具
    # （write_file / edit_file / multi_edit / move_file / notebook_edit /
    # delete_range / delete_symbol）统一收进 Edit 这一族，审批也按 `Edit(<path>)` 存。
    # 反过来，读文件那一族**没有**大写别名，只能写 `read_file(...)`。
    #
    # 开到 `Edit(**)` 是安全的：Reasonix 的 sandbox 已经把写盘限死在 write_roots
    # （= 项目根，`reasonix doctor` 里看得见），这条放行出不了仓库；
    # 真正的红线由下面 deny 段兜——deny > ask > allow，压得住这条。
    'Edit(**)',
]

deny = [
    # 全局 config.toml 里也该有一份同样的兜底。这里再钉一次，
    # 万一哪天全局配置被重置，项目这层还拦得住。
    'Bash(rm -rf*)',
    'Bash(git clean*)',
    'Bash(git push*)',

    # ── 凭据：不许读，也不许写 ─────────────────────────────────────
    # 上面放了 `Edit(**)`，不堵写这一层就等于让无头子代理能改写甚至清空 .env。
    # 按项目实际的凭据文件名增删，但**别把这一段整段删掉**。
    'read_file(.env)',
    'read_file(**/.env)',
    'read_file(**/*.key)',
    'read_file(**/*.pem)',
    'Edit(.env)',
    'Edit(**/.env)',
    'Edit(**/*.key)',
    'Edit(**/*.pem)',

    # ── .git 内部不许写 ───────────────────────────────────────────
    # 改 hooks = 拿到「下次提交时任意代码执行」，改 config = 能偷加一个 remote。
    # 两条都能绕开上面那条「不许 git push」，所以必须一起堵。
    'Edit(.git/**)',
    'Edit(**/.git/**)',
]
